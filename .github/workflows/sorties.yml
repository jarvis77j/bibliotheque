name: sorties
# Met à jour data/sorties.json (onglet « Sorties » de l'app) toutes les heures
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sorties.py", "scripts/editeurs.py", "scripts/ventes.py", "scripts/src_*.py", ".github/workflows/sorties.yml"]
permissions:
  contents: write
concurrency:
  group: sorties
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/sorties.py
        env:
          # après une modification du robot, on relit aussi tout de suite les sites des éditeurs
          EDITEURS: ${{ github.event_name != 'schedule' && '1' || '' }}
      - run: python3 scripts/controle_dates.py
        continue-on-error: true
      - run: python3 scripts/controle_semaine.py
        continue-on-error: true
      # meilleures ventes des librairies indépendantes : un relevé par jour
      - run: python3 scripts/ventes.py
        continue-on-error: true
        env:
          VENTES: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - run: |
          git config user.name "robot-sorties"; git config user.email "robot@users.noreply.github.com"
          git add data/sorties.json data/bd-isbn.json data/ventes.json data/ventes-historique.json 2>/dev/null || git add data/sorties.json
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git -c user.name="robot-sorties" -c user.email="robot@users.noreply.github.com" commit -qm "Sorties mises à jour"
          # si l'app a été mise à jour pendant la collecte, on se replace dessus puis on réessaie
          for i in 1 2 3 4; do
            git pull -q --rebase -X theirs origin main && git push -q origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
