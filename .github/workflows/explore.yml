name: explore-sources
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/explore.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          while read name url; do
            curl -sL -A "$UA" -H "Accept-Language: fr-FR,fr" --max-time 30 -o "out/$name.html" -w "$name %{http_code} %{size_download} %{url_effective}\n" "$url" >> out/_status.txt || echo "$name FAIL" >> out/_status.txt
          done <<'LIST'
          ll_nouveautes https://www.leslibraires.fr/dossiers/nouveautes/
          ll_precommandes https://www.leslibraires.fr/dossiers/precommandes/
          ll_romance https://www.leslibraires.fr/boutique/25/livres-papier/821432/romance
          ll_bd https://www.leslibraires.fr/boutique/25/livres-papier/113870/bd-comics-mangas
          ll_livre https://www.leslibraires.fr/livre/26455468-retour-a-folegandros-agnes-martin-lugand-michel-lafon
          ll_livre2 https://www.leslibraires.fr/livre/26460582-9-les-aigles-de-rome-tome-9-enrico-marini-dargaud
          lh_quelire https://www.livreshebdo.fr/que_lire
          lh_agenda https://www.livreshebdo.fr/agenda
          mc_api https://api.mangacollec.com/v2/planning
          ll_robots https://www.leslibraires.fr/robots.txt
          lh_robots https://www.livreshebdo.fr/robots.txt
          LIST
          cat out/_status.txt
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo
          git checkout -B debug-sources
          rm -rf debug && mkdir debug && echo $GITHUB_RUN_ID > debug/run && cp ../out/* debug/
          git add debug && git -c user.name=bot -c user.email=bot@example.com commit -qm "debug sources" && git push -f origin debug-sources
